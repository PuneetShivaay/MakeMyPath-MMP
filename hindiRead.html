<script>
    $("#input").on("change", function (e) {
        console.log('sa');

        var file = e.target.files[0];
        if (!file) return;

        var FR = new FileReader();
        FR.onload = function (e) {
            var data = new Uint8Array(e.target.result);
            var workbook = XLSX.read(data, {
                type: 'array'
            });
            var firstSheet = workbook.Sheets[workbook.SheetNames[0]];

            var result = XLSX.utils.sheet_to_json(firstSheet, {
                header: 1
            });


            for (var i = 0; i < result.length; i++) {
                fCode.push(result[i][0]);
                cCOde.push(result[i][1]);
            }
            console.log('s');
            //console.log(cCOde);

            //getAllIndexes(cCOde,"C-AZWQ");
            //console.log(cCOde.indexOf('C-AZWQ'))
        };
        FR.readAsArrayBuffer(file);
    });

</script>

<script>
    function jsonConcat(o1, o2) {
        for (var key in o2) {
            o1[key] = o2[key];
        }
        return o1;
    }


    async function readText() {
        var finalJson = {};
        var numberFound = 0;
        var numberFetch = 0;
        var text = document.getElementById('fname').value;
        console.log(document.getElementById('fname').value);
        var fcodeListIn = [];
        var allQuestionAray = []
        for (var i = 0; i < (text.length) / 7; i++) {

            console.log((text.length) / 7);
            var resultArray = getAllIndexes(cCOde, text.substr((i) * 7, 6));
            console.log(text.substr((i) * 7, 6));
            console.log(resultArray.length);
            numberFound = numberFound + resultArray.length;
            for (var j = 0; j < resultArray.length; j++) {
                fcodeListIn.push(fCode[resultArray[j]]);
                console.log(i, fcodeListIn.length);
            }

        }

        for (var j = 0; j < fcodeListIn.length; j++) {
            var starCountRef = await firebase.database().ref('Version1/DataBase/QuestionInTag/' + fcodeListIn[j]);
            await starCountRef.on('value', (snapshot) => {
                numberFetch++;
                console.log(j);
                const data = snapshot.val();
                if (data != null) {
                    finalJson = jsonConcat(finalJson, data);
                }
                if (numberFetch == numberFound) {
                    console.log(finalJson);
                    var keyArray = Object.keys(finalJson);
                    var langData = 'AJ';
                    for (var la = 0; la < langData.length; la++) {
                        JdataArray = [];
                        typeOfQuestion = [];
                        var key = langData.substr(la, 1);
                        for (var i = 0; i < keyArray.length; i++) {
                            if (finalJson[keyArray[i]].toString().substr(0, 1) == key) {
                                JdataArray.push(finalJson[keyArray[i]].toString().substr(2, 4));
                                typeOfQuestion.push(finalJson[keyArray[i]].toString().substr(3, 4));
                            }
                        }
                        tableMaker(key)
                    }


                }

            });
        }
    }

</script>

    function getOccurence(stringToCheck, scanArray) {
        if (scanArray == null) {
            scanArray = JdataArray;
        }
        var count = 0;
        for (var i = 0; i < scanArray.length; i++) {
            if (stringToCheck == scanArray[i]) {
                count++;
            }
        }
        return count;
    }

    function getAllIndexes(arr, val) {
        var indexes = [],
            i = -1;
        while ((i = arr.indexOf(val, i + 1)) != -1) {
            indexes.push(i);
        }
        return indexes;
    }
