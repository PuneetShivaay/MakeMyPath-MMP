<script>
    $("#input").on("change", function (e) {
        console.log('Uploading the file. Please Wait..');

        var file = e.target.files[0];
        if (!file) return;

        var FR = new FileReader();
        FR.onload = function (e) {
            var data = new Uint8Array(e.target.result);
            var workbook = XLSX.read(data, {
                type: 'array'
            });
            var firstSheet = workbook.Sheets[workbook.SheetNames[0]];

            var result = XLSX.utils.sheet_to_json(firstSheet, {
                header: 1
            });

<script>
    function addTable() {
        var myTableDiv = document.getElementById("myDynamicTable");

        var table = document.createElement('TABLE');
        table.border = '1';

        var tableBody = document.createElement('TBODY');
        table.appendChild(tableBody);

        var letters = "PONMLKJIHGFEDCBA";

        for (var i = letters.length; i--;) {
            var tr = document.createElement('TR');
            tableBody.appendChild(tr);

            for (var j = letters.length; j--;) {
                var td = document.createElement('TD');
                var comb = (letters[i] + letters[j]);
                if (comb == 'DG') { // how compare value and write count value in cell
                    td.appendChild(document.createTextNode(comb));
                } else {
                    td.appendChild(document.createTextNode(0));
                }
                td.width = '75';

                tr.appendChild(td);
            }
        }
        myTableDiv.appendChild(table);
    }
    // addTable();
</script>
